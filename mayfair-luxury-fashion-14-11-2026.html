<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Luxury Art, Fashion, Music and Business Event by Iren Nikard, 14 November 2026, Mayfair, London. Ukrainian Sisters gloves on the runway.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Mayfair Evening 14.11 | Ukrainian Sisters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow evening-programme column, like a printed invitation card; red & black dress code drives the palette */
:root{
  --night:#120c0d;
  --velvet:#1e1213;
  --oxblood:#7d0f1c;
  --scarlet:#c8102e;
  --gold:#d4b06a;
  --ivory:#f3ebdf;
  --mute:#b4a596;
  --line:rgba(212,176,106,.28);
  --display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body:"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  color-scheme:dark;
}
body{background:var(--night);color:var(--ivory);font-family:var(--body);font-size:16px;line-height:1.6;}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:40px 56px;display:flex;flex-direction:column;gap:56px;}
a{color:var(--gold)}
a:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
h1,h2{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.1}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:0}
.rule{height:1px;background:var(--line);border:0;margin:0}

/* poster */
.poster{margin:0 auto -40px;max-width:340px;width:78%;position:relative}
.poster img{display:block;width:100%;height:auto}

/* hero */
.hero{display:flex;flex-direction:column;gap:22px;text-align:center;align-items:center}
.hero h1{font-size:clamp(38px,9vw,62px);letter-spacing:-.01em}
.hero h1 em{color:var(--scarlet);font-style:italic}
.by{font-family:var(--display);font-size:20px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0}
.when{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;width:100%;margin-top:6px}
.when .date{font-family:var(--display);font-size:clamp(34px,8vw,48px);font-weight:600;font-variant-numeric:lining-nums tabular-nums;color:var(--ivory)}
.when span.side{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.when span.l{text-align:right}.when span.r{text-align:left}
.place{color:var(--mute);margin:0;max-width:40ch}
.btn{display:inline-block;background:var(--scarlet);color:var(--ivory);text-decoration:none;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:14px;padding:16px 34px;border-radius:2px;transition:background .2s}
.btn:hover{background:var(--oxblood)}
.small{font-size:13px;color:var(--mute);margin:0}

/* gloves feature */
.gloves{background:linear-gradient(160deg,var(--oxblood),var(--velvet) 70%);border:1px solid var(--line);padding:36px 26px;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.gloves h2{font-size:clamp(28px,6.5vw,38px)}
.gloves blockquote{margin:0;font-family:var(--display);font-style:italic;font-size:clamp(20px,4.6vw,24px);line-height:1.35;color:var(--gold);border-left:1px solid var(--gold);padding-left:16px}
.gloves p{margin:0;max-width:60ch}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.facts div{background:var(--velvet);padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.facts b{font-family:var(--display);font-size:22px;font-weight:600;color:var(--ivory)}
.facts small{font-size:12px;color:var(--mute);line-height:1.35}
.glove-grid{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media (min-width:560px){.glove-grid{grid-template-columns:1fr 1fr}}
.glove{margin:0 auto;min-width:0;max-width:420px;width:100%;display:flex;flex-direction:column;gap:8px}
.glove img{display:block;width:100%;height:auto}
.glove figcaption{font-size:13px;letter-spacing:.08em;color:var(--gold)}
.card .links{flex-direction:column;gap:6px;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:14px}

/* programme */
.prog{display:flex;flex-direction:column;gap:20px}
.prog h2{font-size:32px}
.prog dl{margin:0;display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);border-top:1px solid var(--line)}
.prog dt,.prog dd{padding:14px 0;border-bottom:1px solid var(--line);margin:0}
.prog dt{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);padding-right:14px;padding-top:17px}
.prog dd{color:var(--ivory)}
.prog dd .hl{color:var(--scarlet);font-weight:600}

/* art + dress */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{border:1px solid var(--line);padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.card h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.card p{margin:0;color:var(--mute);font-size:15px}
.dress{display:flex;gap:16px;margin-top:4px}
.dress div{display:flex;align-items:center;gap:8px;font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid var(--line)}
.sw.red{background:var(--scarlet)}.sw.black{background:#000}

.close{text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}
.close h2{font-size:clamp(26px,6vw,34px)}
footer{font-size:12px;color:var(--mute);text-align:center;line-height:1.7}
footer p{margin:0}

@media (max-width:480px){
  .pair{grid-template-columns:1fr}
  .facts{grid-template-columns:1fr}
  .prog dl{grid-template-columns:1fr}
  .prog dt{border-bottom:0;padding-bottom:0}
  .prog dd{padding-top:4px}
}
@media (prefers-reduced-motion:no-preference){
  .hero>*{animation:rise .8s ease both}
  .hero>*:nth-child(2){animation-delay:.08s}.hero>*:nth-child(3){animation-delay:.16s}.hero>*:nth-child(4){animation-delay:.24s}
  @keyframes rise{from{transform:translateY(8px)}to{transform:none}}
}
</style>

</head>
